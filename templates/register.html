<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <div class="card shadow-lg p-4">

        <div class="d-flex justify-content-between align-items-center">

            <div>
                <h2 class="text-primary">
                    Gateway Institute of Engineering and Technology
                </h2>

                <h5 class="text-secondary">
                    Student Registration
                </h5>
            </div>

            <img
            src="https://www.local18.in/_next/image/?url=https%3A%2F%2Fmedia.collegedekho.com%2Fmedia%2Fimg%2Finstitute%2Flogo%2FGE.png%3Fimwidth%3D474&w=3840&q=75"
            width="300">
        </div>

        <hr>
{% if message %}
<div class="alert alert-danger">
    {{ message }}
</div>
{% endif %}
        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Student Name</label>

                <input
                type="text"
                name="name"
                class="form-control"
                required>
            </div>

            <div class="mb-3">
                <label class="form-label">Roll Number</label>

                <input
                type="text"
                name="roll_no"
                class="form-control"
                required>
            </div>

            <div class="mb-3">
                <label class="form-label">Course</label>

                <input
                type="text"
                name="course"
                class="form-control"
                required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>

                <input
                type="email"
                name="email"
                class="form-control"
                required>
            </div>

            <button
            type="submit"
            class="btn btn-success w-100">
                Register Student
            </button>

        </form>

        {% if qr_image %}

        <hr>

        <div class="text-center">

            <h3 class="text-success">
                Student Registered Successfully
            </h3>

            <br>

            <img
            src="{{ qr_image }}"
            width="250"
            class="img-thumbnail">

            <br><br>

            <h4>
                Roll Number : {{ roll_no }}
            </h4>

            <br>

            <a
            href="{{ qr_image }}"
            download
            class="btn btn-primary">
                Download QR Code
            </a>

        </div>

        {% endif %}

        <hr>

        <a
        href="/dashboard"
        class="btn btn-secondary">
            Back To Dashboard
        </a>

    </div>

</div>

</body>
</html>
